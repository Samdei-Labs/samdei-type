[project]
name = "samdei-type"
version = "0.1.0"
description = "Samdei Type: convert romanized Khmer (Latin chat spelling) to Khmer script"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Samdei Type Authors" }]
keywords = ["khmer", "romanization", "transliteration", "seq2seq", "nlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy",
  "regex",
  "torch>=2.6",
  "safetensors",
  "huggingface_hub",
  "khmercut",
]

[project.optional-dependencies]
# int8 ONNX decoding (samdei_type.onnx_infer, the onnx backend of Converter and of the samdei-type command)
deploy = ["onnxruntime>=1.18"]

[project.scripts]
samdei-type = "samdei_type.cli:main"

[project.urls]
Homepage = "https://github.com/Samdei-Labs/samdei-type"
Issues = "https://github.com/Samdei-Labs/samdei-type/issues"
"Samdei Type Mini" = "https://huggingface.co/samdei/samdei-type-mini"
"Samdei Type Base" = "https://huggingface.co/samdei/samdei-type-base"
"Samdei Type Bench" = "https://huggingface.co/datasets/samdei/samdei-type-bench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samdei_type"]

[tool.hatch.build.targets.sdist]
include = ["src/samdei_type", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
