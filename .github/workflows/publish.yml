# Publishes to PyPI when a GitHub release is published, with PyPI trusted publishing (no token stored).
# One-time setup on pypi.org: add a trusted publisher for project "samdei-type" with owner "Samdei-Labs",
# repository "samdei-type", workflow "publish.yml" and environment "pypi".
name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
